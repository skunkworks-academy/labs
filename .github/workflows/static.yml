name: Build and deploy Docusaurus to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Docusaurus and overlay existing labs
        run: npm run build:deploy
      - name: Enforce Academy global shell on every generated HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.2'
          loader = f'<script defer src="{current}" data-skunkworks-global-shell="2026.08.15.2"></script>'
          pattern = r"https://skunkworksacademy\.com/assets/academy-navigation\.js(?:\?v=[^\"'\s<>]+)?"
          pages = list(Path('build').rglob('*.html'))
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if 'academy-navigation.js' in html:
                  html = re.sub(pattern, current, html)
              elif '</head>' in html:
                  html = html.replace('</head>', f'{loader}</head>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', f'{loader}</body>', 1)
              else:
                  raise SystemExit(f'Cannot inject Academy shell into {path}')
              path.write_text(html, encoding='utf-8')
          missing = [str(p) for p in pages if current not in p.read_text(encoding='utf-8', errors='ignore')]
          if missing:
              raise SystemExit('Global shell missing from: ' + ', '.join(missing))
          print(f'Verified Academy global shell on {len(pages)} Labs page(s).')
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

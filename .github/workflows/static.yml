name: Build and deploy Docusaurus to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: labs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Docusaurus and overlay existing labs
        run: npm run build:deploy

      - name: Enforce canonical Academy v10 shell on every published HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          loader = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          script = f'<script defer src="{loader}" {marker}></script>'
          pages = sorted(Path('build').rglob('*.html'))
          if not pages:
              raise SystemExit('No published HTML pages found in site/build')

          old_shell = re.compile(
              r'<script\b[^>]*(?:academy-navigation(?:-loader)?\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>',
              re.IGNORECASE | re.DOTALL,
          )

          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              html = old_shell.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {script}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {script}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Cannot inject Academy shell loader into {path}')
              path.write_text(html, encoding='utf-8')

          failures = []
          duplicates = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if html.count(loader) != 1 or html.count(marker) != 1:
                  failures.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicates.append(str(path))
          if failures:
              raise SystemExit('Canonical Academy shell verification failed for: ' + ', '.join(failures))
          if duplicates:
              raise SystemExit('Duplicate Academy shell loaders found in: ' + ', '.join(duplicates))

          print(f'Canonical Academy v10 shell loader verified on {len(pages)} published HTML page(s).')
          PY

      - name: Verify dynamic catalogue, favicon and global-shell-only chrome
        run: |
          test -f build/catalog/labs.json
          test -s build/favicon.ico
          node - <<'NODE'
          const fs = require('node:fs');
          const labs = JSON.parse(fs.readFileSync('build/catalog/labs.json', 'utf8'));
          if (!Array.isArray(labs)) throw new Error('build/catalog/labs.json must contain an array');
          const available = labs.filter((lab) => String(lab.status || '').toLowerCase() === 'available');
          if (!available.length) throw new Error('No available labs found in build/catalog/labs.json');
          console.log(`Verified ${available.length} available lab record(s) in the deployed catalogue artifact.`);
          NODE
          grep -q 'catalog/labs.json' build/index.html
          grep -q '/favicon.ico' build/index.html
          grep -q 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1' build/index.html
          grep -q 'data-skunkworks-global-nav="v10"' build/index.html
          if grep -q 'navbar__inner\|navbar__brand\|footer__links\|footer__bottom' build/index.html; then
            echo 'Native Docusaurus navbar/footer markup must not be rendered on the Labs landing page.'
            exit 1
          fi

      - name: Verify custom domain artifact
        run: |
          test -f build/CNAME
          test "$(tr -d '\r\n' < build/CNAME)" = "labs.skunkworksacademy.com"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Labs production and canonical Academy runtime chain
        run: |
          loader_url='https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          ui_url='https://skunkworksacademy.com/assets/skunkworks-ui.js?v=2026.08.15.1'
          footer_url='https://skunkworksacademy.com/assets/skunkworks-footer.js?v=2026.08.15.1'
          css_url='https://skunkworksacademy.com/assets/skunkworks-design-system.css?v=2026.08.15.1'

          for attempt in {1..30}; do
            home="$(curl --location --fail --silent --show-error --max-time 20 https://labs.skunkworksacademy.com/ || true)"
            legacy="$(curl --location --fail --silent --show-error --max-time 20 https://labs.skunkworksacademy.com/labs/bits-and-bytes-101/ || true)"
            catalogue="$(curl --location --fail --silent --show-error --max-time 20 https://labs.skunkworksacademy.com/catalog/labs.json || true)"
            loader="$(curl --location --fail --silent --show-error --max-time 20 "$loader_url" || true)"
            ui="$(curl --location --fail --silent --show-error --max-time 20 "$ui_url" || true)"
            footer="$(curl --location --fail --silent --show-error --max-time 20 "$footer_url" || true)"
            css="$(curl --location --fail --silent --show-error --max-time 20 "$css_url" || true)"
            favicon_ok=0
            curl --location --fail --silent --show-error --max-time 20 --output /dev/null https://labs.skunkworksacademy.com/favicon.ico && favicon_ok=1 || true

            if printf '%s' "$home" | grep -q 'academy-navigation.js?v=2026.08.15.1' \
              && printf '%s' "$home" | grep -q 'data-skunkworks-global-nav="v10"' \
              && ! printf '%s' "$home" | grep -Eq 'navbar__inner|navbar__brand|footer__links|footer__bottom' \
              && printf '%s' "$home" | grep -q 'catalog/labs.json' \
              && printf '%s' "$legacy" | grep -q 'academy-navigation.js?v=2026.08.15.1' \
              && printf '%s' "$legacy" | grep -q 'data-skunkworks-global-nav="v10"' \
              && printf '%s' "$catalogue" | grep -q '"status": "available"' \
              && printf '%s' "$loader" | grep -q 'skunkworks-ui.js' \
              && printf '%s' "$loader" | grep -q 'skunkworks-footer.js' \
              && printf '%s' "$loader" | grep -q 'skunkworks-design-system.css' \
              && printf '%s' "$ui" | grep -q 'Skunkworks Academy Global UI' \
              && printf '%s' "$footer" | grep -q 'Skunkworks Academy Global Footer' \
              && printf '%s' "$css" | grep -q 'Skunkworks Academy Global Design System' \
              && [ "$favicon_ok" -eq 1 ]; then
              echo 'Labs production verification succeeded with canonical Academy UI, footer and design system.'
              exit 0
            fi
            sleep 10
          done
          echo 'Labs production verification failed.'
          exit 1

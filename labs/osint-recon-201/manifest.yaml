learningOutcomes:
  - Define an OSINT requirement, authority boundary, scope and stop conditions before collecting information.
  - Select Recon-ng marketplace modules deliberately by input, output, dependencies and API-key requirements.
  - Interpret synthetic Recon-ng host observations and Shodan-style service records without overclaiming ownership or vulnerability.
  - Correlate independent public-source evidence and distinguish observation, inference, confidence and recommended action.
  - Produce a concise, reproducible and privacy-aware OSINT evidence note.
evidence:
  checkpoints:
    - authority-and-scope-check
    - recon-module-selection-check
    - synthetic-recon-evidence-check
    - shodan-interpretation-check
    - correlation-and-reporting-check
    - six-question-safety-check
  completionRecord: local-learning-record-only

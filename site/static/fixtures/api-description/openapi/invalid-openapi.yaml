openapi: 3.1.2
info:
  title: Northstar Learner API - review copy
  version: 1.4
paths:
  /learners/{learnerId}:
    get:
      operationId: learnerLookup
      security:
        - {}
      responses:
        '404':
          description: Learner not found
  /learners:
    post:
      operationId: create_learner
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string}
                email: {type: string}
                isAdmin: {type: boolean}
      responses:
        '200':
          description: Created record including internal notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  email: {type: string}
                  passwordHash: {type: string}
                  internalNotes: {type: string}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
